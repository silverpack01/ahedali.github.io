<script>
// ===== Canvas =====
const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');
let W, H, gridImg = null;

function resizeCanvas() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cacheGrid();
}
function cacheGrid() {
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const oc = off.getContext('2d');
    oc.strokeStyle = 'rgba(100,120,255,0.045)';
    oc.lineWidth = 1;
    const s = 60;
    for (let x = 0; x <= W; x += s) { oc.beginPath(); oc.moveTo(x,0); oc.lineTo(x,H); oc.stroke(); }
    for (let y = 0; y <= H; y += s) { oc.beginPath(); oc.moveTo(0,y); oc.lineTo(W,y); oc.stroke(); }
    gridImg = off;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const particles = Array.from({ length: 25 }, () => ({
    x: Math.random() * (W||1200), y: Math.random() * (H||800),
    vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
    r: Math.random() * 1.5 + 0.3, alpha: Math.random() * 0.3 + 0.1,
    color: Math.random() < 0.6 ? '77,138,255' : '155,93,229'
}));

let frameCount = 0;
function animate() {
    frameCount++;
    ctx.clearRect(0, 0, W, H);
    if (gridImg) ctx.drawImage(gridImg, 0, 0);
    if (frameCount % 2 === 0) {
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
            if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        });
    }
    particles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
        ctx.fill();
    });
    if (frameCount % 3 === 0) {
        for (let i = 0; i < particles.length; i++) {
            for (let j = i+1; j < particles.length; j++) {
                const dx = particles[i].x-particles[j].x, dy = particles[i].y-particles[j].y;
                const distSq = dx*dx+dy*dy;
                if (distSq < 10000) {
                    const dist = Math.sqrt(distSq);
                    ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y);
                    ctx.strokeStyle = `rgba(77,138,255,${0.08*(1-dist/100)})`; ctx.lineWidth = 0.5; ctx.stroke();
                }
            }
        }
    }
    requestAnimationFrame(animate);
}
animate();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCJVhjN4M-EDtZ-e5x2PpzLSAl5bUd_pSs",
    authDomain: "alpha-portfolio-e0daf.firebaseapp.com",
    projectId: "alpha-portfolio-e0daf",
    storageBucket: "alpha-portfolio-e0daf.firebasestorage.app",
    messagingSenderId: "372148571408",
    appId: "1:372148571408:web:2649567f16d2a6d40fa995"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const tagMap = {
    AI:   { label: 'AI',   cls: '' },
    AUTO: { label: 'AUTO', cls: 'auto' },
    SEC:  { label: 'SEC',  cls: 'cyber' },
    WEB:  { label: 'WEB',  cls: 'web' },
};

const fallback = 'https://images.pexels.com/photos/1181244/pexels-photo-1181244.jpeg?auto=compress&cs=tinysrgb&w=400';
let allProjects = [];
let currentFilter = 'ALL';

function renderGrid() {
    const grid = document.getElementById('projects-grid');
    const filtered = currentFilter === 'ALL'
        ? allProjects
        : allProjects.filter(p => p.cat === currentFilter);

    document.getElementById('project-count').innerHTML =
        'SHOWING <span>' + filtered.length + '</span> OF <span>' + allProjects.length + '</span> PROJECTS';

    if (!filtered.length) {
        grid.innerHTML = '<div class="loading-state" style="animation:none">NO PROJECTS FOUND</div>';
        return;
    }

    grid.innerHTML = filtered.map(p => {
        const tag = tagMap[p.cat] || tagMap.AI;
        return '<div class="service-box">' +
            '<div class="card-glow"></div>' +
            '<div class="card-tag ' + tag.cls + '">' + tag.label + '</div>' +
            '<img loading="lazy" decoding="async" width="400" height="155" src="' + (p.img || fallback) + '" alt="' + p.name + '" onerror="this.src=\'' + fallback + '\'">' +
            '<h3>' + p.name + '</h3>' +
            '<p>' + p.desc + '</p>' +
            '<a href="' + (p.repo || '#') + '" target="_blank" rel="noopener" class="btn-secondary">REPO &rarr;</a>' +
        '</div>';
    }).join('');

    grid.querySelectorAll('.service-box').forEach((box, i) => {
        box.style.opacity = '0';
        box.style.transform = 'translateY(16px)';
        setTimeout(() => {
            box.style.transition = 'opacity 0.5s ease, transform 0.5s ease, border-color 0.3s ease, box-shadow 0.3s ease';
            box.style.opacity = '1';
            box.style.transform = 'translateY(0)';
        }, i * 60);
    });
}

window.filterProjects = function(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
};

try {
    const snap = await getDocs(query(collection(db, 'projects'), orderBy('added', 'asc')));
    snap.forEach(d => allProjects.push({ id: d.id, ...d.data() }));
    renderGrid();
} catch (e) {
    document.getElementById('projects-grid').innerHTML =
        '<div class="loading-state" style="animation:none;color:var(--neon-red)">LOAD FAILED: ' + e.message + '</div>';
}
</script>
